[package]
name = "usyseek_rust"
version = "0.4.0"
edition = "2024"
publish = false

[lib]
name = "usyseek_rust"
crate-type = ["staticlib"]

[[bin]]
name = "usyseek-migrate"
path = "src/bin/usyseek-migrate.rs"

[dependencies]
qdrant-edge = "0.9.0"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
serde_json = "1.0"
resvg = "0.49"

# Panics unwind (the default) so the SVG renderer can be isolated with catch_unwind;
# one that reaches an `extern "C"` boundary still aborts.
[profile.release]
codegen-units = 16
lto = "thin"
strip = true
opt-level = 3
