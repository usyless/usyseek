[package]
name = "usyseek_rust"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "usyseek_rust"
crate-type = ["staticlib"]

[dependencies]
qdrant-client = { version = "=1.20.0", default-features = false, features = ["serde"] }
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "time"] }
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
serde_json = "1.0"
resvg = "0.49"

# Panics unwind (the default) so the SVG renderer can be isolated with catch_unwind;
# one that reaches an `extern "C"` boundary still aborts.
[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = 3
